<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonastral — Presentation</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #2d1b69 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: clip;
        }

        html {
            overflow-x: clip;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.6);
            opacity: 0;
            will-change: opacity, transform;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0.6);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .shooting-star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.8);
            animation: shoot 8s linear infinite;
            opacity: 0;
        }

        .shooting-star::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.8), transparent);
            transform: translateX(-80px);
        }

        @keyframes shoot {
            0% {
                transform: translate(0, 0) rotate(20deg);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            15% {
                opacity: 1;
            }
            25%, 100% {
                transform: translate(400px, 150px) rotate(20deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 900px;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            margin-bottom: 2.5rem;
            display: inline-block;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .logo svg {
            width: 180px;
            height: 180px;
            filter: drop-shadow(0 0 30px rgba(138, 92, 246, 0.6));
        }

        h1 {
            font-family: 'Comfortaa', 'Nunito', sans-serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 700;
            letter-spacing: 0.01em;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, #b8a4ff 50%, #8a5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .features {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
        }

        .feature {
            max-width: 620px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.75rem 1.5rem;
            transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease;
        }

        .feature:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(138, 92, 246, 0.4);
        }

        .feature h3 {
            font-size: 1.4rem;
            margin-bottom: 0.85rem;
            color: #fff;
        }

        .feature p {
            font-size: 1rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.7);
        }

        footer {
            margin-top: 4rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .lang-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 10;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            overflow: hidden;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .lang-toggle:hover {
            transform: scale(1.08);
            border-color: rgba(138, 92, 246, 0.6);
            box-shadow: 0 0 20px rgba(138, 92, 246, 0.4);
        }

        .lang-toggle:active {
            transform: scale(0.95);
        }

        .lang-toggle svg {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: block;
            transition: opacity 0.25s ease;
        }

        .lang-menu {
            position: fixed;
            top: 5.5rem;
            right: 1.5rem;
            z-index: 10;
            background: rgba(20, 22, 50, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 0.5rem;
            min-width: 180px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(-8px) scale(0.96);
            transform-origin: top right;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .lang-menu.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .lang-option {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.6rem 0.75rem;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s ease;
        }

        .lang-option:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .lang-option.active {
            background: rgba(138, 92, 246, 0.2);
            color: #fff;
        }

        .lang-option svg {
            width: 24px;
            height: 16px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .lang-toggle:focus-visible,
        .lang-option:focus-visible {
            outline: 2px solid #b8a4ff;
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            .logo,
            .container,
            .shooting-star {
                animation: none !important;
            }

            .star {
                animation: none !important;
                opacity: 0.7 !important;
                transform: scale(1) !important;
            }

            * {
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <button class="lang-toggle" id="langToggle" aria-label="Change language" aria-haspopup="true" aria-expanded="false">
        <span id="flagSlot"></span>
    </button>

    <div class="lang-menu" id="langMenu" role="menu"></div>

    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#8a5cf6;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#8a5cf6;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <circle cx="100" cy="100" r="90" fill="none" stroke="url(#grad1)" stroke-width="3" opacity="0.5"/>
                <circle cx="100" cy="100" r="70" fill="none" stroke="url(#grad2)" stroke-width="2" opacity="0.7"/>
                <path d="M 60 130 L 80 70 L 100 110 L 120 70 L 140 130"
                      fill="none"
                      stroke="url(#grad1)"
                      stroke-width="6"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>
                <circle cx="100" cy="55" r="6" fill="#fff"/>
                <circle cx="100" cy="55" r="10" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
            </svg>
        </div>

        <h1>Wonastral</h1>

        <div class="features">
            <div class="feature">
                <h3 data-i18n="featureTitle">Modern Application builder</h3>
                <p data-i18n="featureText">Wonastral designs and develops modern applications, crafted to deliver smooth, performant and elegant experiences. From concept to production, we bring your ideas to life with today's technologies.</p>
            </div>
        </div>

        <footer data-i18n="footer">
            &copy; 2026 Wonastral — All rights reserved
        </footer>
    </div>

    <script>
        const FLAGS = {
            en: '<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="40" fill="#012169"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#FFFFFF" stroke-width="6"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#C8102E" stroke-width="3"/><path d="M30,0 V40 M0,20 H60" stroke="#FFFFFF" stroke-width="10"/><path d="M30,0 V40 M0,20 H60" stroke="#C8102E" stroke-width="5"/></svg>',
            fr: '<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><rect width="20" height="40" fill="#0055A4"/><rect x="20" width="20" height="40" fill="#FFFFFF"/><rect x="40" width="20" height="40" fill="#EF4135"/></svg>',
            es: '<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="10" fill="#AA151B"/><rect y="10" width="60" height="20" fill="#F1BF00"/><rect y="30" width="60" height="10" fill="#AA151B"/></svg>',
            de: '<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="13.33" fill="#000000"/><rect y="13.33" width="60" height="13.33" fill="#DD0000"/><rect y="26.66" width="60" height="13.34" fill="#FFCE00"/></svg>',
            it: '<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><rect width="20" height="40" fill="#009246"/><rect x="20" width="20" height="40" fill="#FFFFFF"/><rect x="40" width="20" height="40" fill="#CE2B37"/></svg>'
        };

        const TRANSLATIONS = {
            en: {
                name: "English",
                title: "Wonastral — Presentation",
                featureTitle: "Modern Application builder",
                featureText: "Wonastral designs and develops modern applications, crafted to deliver smooth, performant and elegant experiences. From concept to production, we bring your ideas to life with today's technologies.",
                footer: "© 2026 Wonastral — All rights reserved"
            },
            fr: {
                name: "Français",
                title: "Wonastral — Présentation",
                featureTitle: "Créateur d'applications modernes",
                featureText: "Wonastral conçoit et développe des applications modernes, pensées pour offrir des expériences fluides, performantes et élégantes. Du concept à la mise en production, nous donnons vie à vos idées avec les technologies d'aujourd'hui.",
                footer: "© 2026 Wonastral — Tous droits réservés"
            },
            es: {
                name: "Español",
                title: "Wonastral — Presentación",
                featureTitle: "Creador de aplicaciones modernas",
                featureText: "Wonastral diseña y desarrolla aplicaciones modernas, pensadas para ofrecer experiencias fluidas, eficientes y elegantes. Del concepto a la producción, damos vida a tus ideas con las tecnologías de hoy.",
                footer: "© 2026 Wonastral — Todos los derechos reservados"
            },
            de: {
                name: "Deutsch",
                title: "Wonastral — Präsentation",
                featureTitle: "Entwickler moderner Anwendungen",
                featureText: "Wonastral entwirft und entwickelt moderne Anwendungen, die flüssige, leistungsstarke und elegante Erlebnisse bieten. Vom Konzept bis zur Produktion erwecken wir Ihre Ideen mit den Technologien von heute zum Leben.",
                footer: "© 2026 Wonastral — Alle Rechte vorbehalten"
            },
            it: {
                name: "Italiano",
                title: "Wonastral — Presentazione",
                featureTitle: "Creatore di applicazioni moderne",
                featureText: "Wonastral progetta e sviluppa applicazioni moderne, pensate per offrire esperienze fluide, performanti ed eleganti. Dal concetto alla produzione, diamo vita alle tue idee con le tecnologie di oggi.",
                footer: "© 2026 Wonastral — Tutti i diritti riservati"
            }
        };

        const DEFAULT_LANG = 'en';

        function generateStars(container, starCount = 120, shooterCount = 3) {
            const frag = document.createDocumentFragment();

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 0.5;
                const brightness = Math.random() * 0.6 + 0.4;
                const duration = Math.random() * 4 + 3;
                const delay = Math.random() * 6;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = (Math.random() * 100) + '%';
                star.style.top = (Math.random() * 100) + '%';
                star.style.background = `rgba(255, 255, 255, ${brightness})`;
                star.style.boxShadow = `0 0 6px 1px rgba(255, 255, 255, ${brightness * 0.7})`;
                star.style.animation = `twinkle ${duration}s ease-in-out ${delay}s infinite`;
                frag.appendChild(star);
            }

            for (let i = 0; i < shooterCount; i++) {
                const shooter = document.createElement('div');
                shooter.className = 'shooting-star';
                shooter.style.left = (Math.random() * 70) + '%';
                shooter.style.top = (Math.random() * 50) + '%';
                shooter.style.animationDelay = (i * 6 + Math.random() * 4) + 's';
                frag.appendChild(shooter);
            }

            container.appendChild(frag);
        }

        function initLanguageSwitcher(toggle, menu, flagSlot) {
            const options = new Map();
            let currentLang = DEFAULT_LANG;

            function applyLanguage(lang) {
                const dict = TRANSLATIONS[lang];
                if (!dict) return;
                currentLang = lang;

                document.documentElement.lang = lang;
                document.title = dict.title;

                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (dict[key] !== undefined) el.textContent = dict[key];
                });

                flagSlot.innerHTML = FLAGS[lang];
                toggle.setAttribute('title', dict.name);
                toggle.setAttribute('aria-label', 'Current language: ' + dict.name);

                options.forEach((btn, code) => {
                    btn.classList.toggle('active', code === lang);
                    btn.setAttribute('aria-current', code === lang ? 'true' : 'false');
                });
            }

            function openMenu() {
                menu.classList.add('open');
                toggle.setAttribute('aria-expanded', 'true');
                const active = menu.querySelector('.lang-option.active') || menu.firstElementChild;
                if (active) active.focus();
            }

            function closeMenu(returnFocus = false) {
                menu.classList.remove('open');
                toggle.setAttribute('aria-expanded', 'false');
                if (returnFocus) toggle.focus();
            }

            function isOpen() {
                return menu.classList.contains('open');
            }

            function focusSibling(direction) {
                const items = Array.from(menu.querySelectorAll('.lang-option'));
                const idx = items.indexOf(document.activeElement);
                if (idx === -1) { items[0]?.focus(); return; }
                const next = (idx + direction + items.length) % items.length;
                items[next].focus();
            }

            Object.keys(TRANSLATIONS).forEach(code => {
                const btn = document.createElement('button');
                btn.className = 'lang-option';
                btn.type = 'button';
                btn.setAttribute('role', 'menuitem');
                btn.setAttribute('data-lang', code);
                btn.innerHTML = FLAGS[code] + '<span>' + TRANSLATIONS[code].name + '</span>';
                btn.addEventListener('click', () => {
                    applyLanguage(code);
                    closeMenu(true);
                });
                menu.appendChild(btn);
                options.set(code, btn);
            });

            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                isOpen() ? closeMenu() : openMenu();
            });

            document.addEventListener('click', (e) => {
                if (!menu.contains(e.target) && e.target !== toggle) closeMenu();
            });

            document.addEventListener('keydown', (e) => {
                if (!isOpen()) return;
                if (e.key === 'Escape') { closeMenu(true); }
                else if (e.key === 'ArrowDown') { e.preventDefault(); focusSibling(1); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); focusSibling(-1); }
            });

            applyLanguage(currentLang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            generateStars(document.getElementById('stars'));
            initLanguageSwitcher(
                document.getElementById('langToggle'),
                document.getElementById('langMenu'),
                document.getElementById('flagSlot')
            );
        });
    </script>
</body>
</html>
